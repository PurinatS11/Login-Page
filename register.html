<!DOCTYPE html>
<html>

<head>
    <title>Create Account</title>
    <style>
        body {
            text-align: center;
            font-size: 20px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;

        }

        input {
            margin-top: 0.5em;
            margin-bottom: 0.5em;
            height: 22px;
            font-size: 20px;
        }

        img {
            margin-bottom: 1em;
        }

        .button {
            font-size: 45px;
            background-color: #4b9ef7;
            text-align: center;
            border-radius: 9px;
            padding: 12px 14px;
            text-decoration: none;
            color: black;
            display: inline-block;
            margin-top: 1em;
            margin-bottom: 1.5em;
            font-weight: bold;

        }
    </style>
</head>

<body>

    <img src="image/gmail logo.png" alt="gmail logo" width=150"><br>
    <h1> Create Account</h1>
    First Name: <input type="text" size="25" required> <br>
    Last Name: <input type="text" size="25" required> <br>
    Email: <input type="email" name="yourmail" required size="30"><br>
    Password: <input type="password" name="user_password" size="30"> <br>
    Confirm Password: <input type="password" name="user_password" size="25"> <br>
    <div>
        <a href="index.html" class="button"> Register</a>
    </div>
    <a href="index.html" style="text-decoration: none;">Already have an account? Sign In</a>

</body>

</html>
